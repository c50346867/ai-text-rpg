<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700" />
      <stop offset="50%" style="stop-color:#ff8c00" />
      <stop offset="100%" style="stop-color:#ffd700" />
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444" />
      <stop offset="100%" style="stop-color:#cc2200" />
    </linearGradient>
    <linearGradient id="swordGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#888" />
      <stop offset="50%" style="stop-color:#ddd" />
      <stop offset="100%" style="stop-color:#fff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="100" cy="50" r="1.5"/><circle cx="250" cy="80" r="1"/>
    <circle cx="400" cy="30" r="2"/><circle cx="550" cy="70" r="1"/>
    <circle cx="700" cy="45" r="1.5"/><circle cx="850" cy="90" r="1"/>
    <circle cx="1000" cy="40" r="2"/><circle cx="1120" cy="60" r="1.5"/>
    <circle cx="150" cy="120" r="1"/><circle cx="350" cy="100" r="1.5"/>
    <circle cx="650" cy="110" r="1"/><circle cx="950" cy="100" r="1.5"/>
    <circle cx="1080" cy="30" r="1"/><circle cx="50" cy="95" r="1"/>
  </g>

  <!-- Decorative frame -->
  <rect x="20" y="20" width="1160" height="360" rx="10" ry="10"
        fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
  <rect x="25" y="25" width="1150" height="350" rx="8" ry="8"
        fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3"/>

  <!-- Dragon silhouette (right side) -->
  <g filter="url(#glowStrong)" opacity="0.15">
    <path d="M920 130 Q950 80 1000 60 Q1050 40 1100 50 L1120 55 L1100 70
             Q1080 60 1050 65 Q1020 70 1000 90 L990 110
             Q1020 95 1050 90 Q1080 85 1100 90 L1120 95 L1100 100
             Q1060 100 1030 115 L1010 130 Q1050 115 1080 120 L1110 130 L1090 140
             Q1050 135 1010 150 L980 170 L950 190
             Q930 210 900 240 L880 260 Q860 280 840 310
             L820 340 Q810 355 800 360 L780 350 Q790 330 800 310
             L820 280 Q840 250 860 230 L890 200 L920 160 Z"
          fill="url(#dragonGrad)"/>
  </g>

  <!-- Dragon wing -->
  <g filter="url(#glow)" opacity="0.1">
    <path d="M950 120 Q980 90 1020 70 Q1060 50 1150 40
             L1130 60 Q1080 65 1040 80 Q1000 95 970 120 Z"
          fill="#ff6644"/>
  </g>

  <!-- Sword (left side decorative) -->
  <g filter="url(#glow)" opacity="0.15" transform="translate(200, 80)">
    <rect x="-3" y="0" width="6" height="200" fill="url(#swordGrad)" rx="2"/>
    <rect x="-8" y="200" width="16" height="20" fill="#aa8844" rx="3"/>
    <rect x="-6" y="220" width="12" height="15" fill="#886633" rx="2"/>
    <circle cx="0" cy="210" r="4" fill="#ff0000" opacity="0.8"/>
  </g>

  <!-- Shield (left side) -->
  <g filter="url(#glow)" opacity="0.1" transform="translate(160, 150)">
    <path d="M0 0 L-40 15 L-45 60 Q-45 100 0 130 Q45 100 45 60 L40 15 Z"
          fill="none" stroke="#ffd700" stroke-width="3"/>
    <path d="M0 20 L-20 30 L-22 55 Q-22 80 0 100 Q22 80 22 55 L20 30 Z"
          fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- D20 Dice (decorative) -->
  <g filter="url(#glow)" opacity="0.12" transform="translate(280, 260)">
    <polygon points="0,-30 28,-10 28,20 0,35 -28,20 -28,-10"
             fill="#ff4444" stroke="#ffd700" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" fill="#ffd700" font-size="16"
          font-family="serif" font-weight="bold">20</text>
  </g>

  <!-- Magic circle decorations -->
  <g filter="url(#glow)" opacity="0.08">
    <circle cx="600" cy="200" r="150" fill="none" stroke="#4fc3f7" stroke-width="1"/>
    <circle cx="600" cy="200" r="140" fill="none" stroke="#4fc3f7" stroke-width="0.5" stroke-dasharray="5,5"/>
    <circle cx="600" cy="200" r="120" fill="none" stroke="#ffd700" stroke-width="1" transform="rotate(15, 600, 200)"/>
    <circle cx="600" cy="200" r="110" fill="none" stroke="#ff8c00" stroke-width="0.5" stroke-dasharray="3,8"/>
  </g>

  <!-- Central Title -->
  <text x="600" y="165" text-anchor="middle" fill="url(#goldText)"
        font-size="64" font-weight="bold" font-family="Georgia, serif"
        filter="url(#glowStrong)">
    AI TEXT RPG
  </text>
  <text x="600" y="205" text-anchor="middle" fill="#aaaacc"
        font-size="24" font-family="Arial, sans-serif" letter-spacing="4">
    AI 驱动的文本跑团游戏引擎
  </text>

  <!-- Subtitle line -->
  <line x1="380" y1="225" x2="820" y2="225"
        stroke="url(#goldText)" stroke-width="1" opacity="0.5"/>

  <!-- Features list -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#8888aa">
    <text x="320" y="260" text-anchor="middle">🎲 AI DM 主持人</text>
    <text x="480" y="260" text-anchor="middle">⚔️ 回合制战斗</text>
    <text x="640" y="260" text-anchor="middle">🗺️ 开放世界</text>
    <text x="800" y="260" text-anchor="middle">📜 分支剧情</text>

    <text x="320" y="285" text-anchor="middle">🧙 6大职业</text>
    <text x="480" y="285" text-anchor="middle">👥 5种种族</text>
    <text x="640" y="285" text-anchor="middle">🐉 怪物图鉴</text>
    <text x="800" y="285" text-anchor="middle">🎒 装备系统</text>
  </g>

  <!-- Bottom tech tags -->
  <g font-family="monospace" font-size="11" fill="#556688">
    <rect x="360" y="320" width="80" height="22" rx="4" fill="#1a2233" stroke="#334466" stroke-width="1"/>
    <text x="400" y="335" text-anchor="middle" fill="#88aacc">FastAPI</text>

    <rect x="460" y="320" width="85" height="22" rx="4" fill="#1a2233" stroke="#334466" stroke-width="1"/>
    <text x="502" y="335" text-anchor="middle" fill="#88aacc">Streamlit</text>

    <rect x="565" y="320" width="70" height="22" rx="4" fill="#1a2233" stroke="#334466" stroke-width="1"/>
    <text x="600" y="335" text-anchor="middle" fill="#88aacc">Python</text>

    <rect x="655" y="320" width="75" height="22" rx="4" fill="#1a2233" stroke="#334466" stroke-width="1"/>
    <text x="692" y="335" text-anchor="middle" fill="#88aacc">Pydantic</text>

    <rect x="750" y="320" width="50" height="22" rx="4" fill="#1a2233" stroke="#334466" stroke-width="1"/>
    <text x="775" y="335" text-anchor="middle" fill="#88aacc">MIT</text>
  </g>

  <!-- Bottom corner ornaments -->
  <text x="50" y="370" fill="#ffd700" font-size="12" font-family="serif" opacity="0.4">✦ ⚜ ✦</text>
  <text x="1080" y="370" text-anchor="end" fill="#ffd700" font-size="12" font-family="serif" opacity="0.4">✦ ⚜ ✦</text>
</svg>
